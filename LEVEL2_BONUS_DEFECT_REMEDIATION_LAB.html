        /* Sidebar */

        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); }
        .sidebar-title { margin: 0 0 4px 0; font-size: 16px; font-weight: 800; color: #fff; }
        .sidebar-subtitle { font-size: 12px; color: var(--text-muted); margin: 0 0 14px 0; }
        .score-pill { background: linear-gradient(135deg, #0284c7, #2563eb); padding: 8px 14px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }

        .bug-item.active { border-color: var(--accent); background: #1a2949; box-shadow: 0 0 12px rgba(56, 189, 248, 0.15); }
        .bug-item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .bug-item-id { font-weight: 800; font-size: 13px; color: var(--accent); }
        .bug-item-title { font-size: 12px; font-weight: 600; color: #e2e8f0; line-height: 1.4; }

        .badge-critical { background: #7f1d1d; color: #fca5a5; }
        .badge-high { background: #78350f; color: #fcd34d; }
        .badge-medium { background: #1e3a8a; color: #93c5fd; }
        .badge-resolved { background: #14532d; color: #86efac; }
        .badge-ai { background: #4c1d95; color: #d8b4fe; }
        
        /* Main Viewport */
        .viewport { flex: 1; display: flex; flex-direction: column; overflow-y: auto; background: var(--bg); }
        .topbar { padding: 16px 28px; background: var(--card-bg); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .topbar-meta { display: flex; gap: 16px; align-items: center; }
        .topbar-item { font-size: 12px; color: var(--text-muted); }
        .topbar-item strong { color: #fff; }
        
        .content { padding: 28px; max-width: 1300px; }

        .defect-header-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .defect-id-line { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
        .defect-headline { font-size: 20px; font-weight: 800; color: #fff; margin: 0 0 8px 0; }
        .defect-desc { color: #cbd5e1; font-size: 13px; line-height: 1.6; margin: 0; }
        
        /* 3-Column Proofs */
        .proofs-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 20px; }
        .proof-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
        .proof-lbl { font-size: 11px; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin-bottom: 6px; }
        .proof-val { font-size: 13px; font-weight: 700; color: #fff; }
        
        /* Tab Nav */
        .tab-nav { display: flex; gap: 8px; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 18px; }
        .tab-button { background: #1e293b; color: var(--text-muted); border: 1px solid var(--border); padding: 7px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.2s; }
        .tab-button:hover { background: #334155; color: #fff; }
        .tab-button.active { background: var(--accent); color: #090d16; border-color: var(--accent); }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        /* Code Diff Grid */
        .diff-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
        .diff-col { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
        .diff-header { padding: 10px 14px; font-size: 12px; font-weight: 700; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
        .diff-header.vuln { background: #7f1d1d33; color: #fca5a5; }
        .diff-header.patch { background: #14532d33; color: #86efac; }
        .code-box { padding: 14px; margin: 0; background: var(--code-bg); font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; line-height: 1.5; color: #e2e8f0; overflow-x: auto; white-space: pre-wrap; }
        
        .ai-panel { background: #160e29; border: 1px solid #4c1d95; border-radius: 10px; padding: 18px; margin-bottom: 20px; }
        .ai-title { color: #d8b4fe; font-size: 14px; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        
        .cli-box { background: #050811; border: 1px solid #1e293b; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 12px; color: #38bdf8; overflow-x: auto; margin-top: 8px; }
    </style>
